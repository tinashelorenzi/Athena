# Athena local infrastructure.
#
# `docker compose up -d` starts PostgreSQL provisioned from the credentials in
# `.env` (Compose auto-loads that file for ${VAR} substitution). The Next.js app
# and Prisma connect to the same database via DATABASE_URL in that .env.
#
#   docker compose up -d        # start postgres in the background
#   docker compose logs -f db   # tail the database logs
#   docker compose down         # stop (add -v to also delete the data volume)

services:
  db:
    image: postgres:17-alpine
    container_name: athena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — publish on POSTGRES_PORT (default 5432) so the Next.js
      # dev server on the host can reach it at localhost:${POSTGRES_PORT}.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - athena-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  athena-pgdata:
