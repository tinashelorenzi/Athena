# Athena infrastructure.
#
# Data services (Postgres + S3-compatible object storage) come up by default;
# the app + workers are opt-in behind the `app` profile.
#
#   docker compose up -d                     # postgres + storage + create bucket
#   ./minio-credentials.sh                   # print storage settings for Athena
#                                              → Settings → Storage
#   docker compose --profile app up -d       # ...also build & run the app + workers
#   docker compose down                      # stop (add -v to wipe data volumes)
#
# All values come from .env (Compose auto-loads it for ${VAR} substitution).
#
# Object storage is RustFS (Apache-2.0, S3-compatible). It replaced MinIO in
# 2026-10 when MinIO stopped publishing its container images; the MINIO_* .env
# names are kept so existing .env files work. Moving existing MinIO data across:
# docs/deploy.md.

services:
  db:
    image: postgres:17-alpine
    container_name: athena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - athena-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.3
    container_name: athena-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${MINIO_PORT:-9000}:9000"           # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - athena-rustfs:/data
    networks:
      default:
        # Storage settings saved as http://minio:9000 (the MinIO-era service
        # name) keep working.
        aliases: [minio]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the bucket. New buckets have no public policy, so objects
  # are served only through the app. Safe to re-run; exits when done.
  storage-init:
    image: amazon/aws-cli:2.38.5
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$MINIO_BUCKET" 2>/dev/null ||
              aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$$MINIO_BUCKET" >/dev/null; do
          echo 'waiting for storage...'; sleep 2;
        done &&
        echo "Storage bucket ready (private): $$MINIO_BUCKET"
    restart: "no"

  app:
    profiles: ["app"]
    build: .
    container_name: athena-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ATHENA_SETTINGS_KEY: ${ATHENA_SETTINGS_KEY}
      # HTTP staging → set SESSION_COOKIE_SECURE=false in .env, or serve over HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    command: sh -c "npx prisma migrate deploy && npm run start"
    ports:
      - "3000:3000"

  realtime:
    profiles: ["app"]
    build: .
    container_name: athena-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ATHENA_SETTINGS_KEY: ${ATHENA_SETTINGS_KEY}
      SOC_REALTIME_PORT: "3002"
    # WebSocket feed service. Proxy `/ws` to this in nginx.
    command: npx tsx scripts/soc-realtime.ts
    ports:
      - "3002:3002"

volumes:
  athena-pgdata:
  # RustFS data. The old MinIO volume (athena-minio) is deliberately not listed,
  # so `docker compose down -v` can't delete it before its data is moved.
  athena-rustfs:
