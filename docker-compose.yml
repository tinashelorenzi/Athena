# Athena infrastructure.
#
# Data services (Postgres + MinIO) come up by default; the app + workers are
# opt-in behind the `app` profile.
#
#   docker compose up -d                     # postgres + minio + create bucket
#   ./minio-credentials.sh                   # mint storage creds for Settings
#   docker compose --profile app up -d       # ...also build & run the app + workers
#   docker compose down                      # stop (add -v to wipe data volumes)
#
# All values come from .env (Compose auto-loads it for ${VAR} substitution).

services:
  db:
    image: postgres:17-alpine
    container_name: athena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - athena-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: athena-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"           # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - athena-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the bucket and keep it private (served via the app, not
  # anonymously). Retries until MinIO is reachable, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc mb --ignore-existing local/$$MINIO_BUCKET; do
          echo 'waiting for minio...'; sleep 2;
        done &&
        mc anonymous set none local/$$MINIO_BUCKET &&
        echo "MinIO bucket ready (private): $$MINIO_BUCKET"
    restart: "no"

  app:
    profiles: ["app"]
    build: .
    container_name: athena-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ATHENA_SETTINGS_KEY: ${ATHENA_SETTINGS_KEY}
      # HTTP staging → set SESSION_COOKIE_SECURE=false in .env, or serve over HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    command: sh -c "npx prisma migrate deploy && npm run start"
    ports:
      - "3000:3000"

  workers:
    profiles: ["app"]
    build: .
    container_name: athena-workers
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ATHENA_SETTINGS_KEY: ${ATHENA_SETTINGS_KEY}
    command: npx pm2-runtime start ecosystem.config.js

volumes:
  athena-pgdata:
  athena-minio:
